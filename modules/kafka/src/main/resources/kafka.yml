spring:
  kafka:
    bootstrap-servers: ${BOOTSTRAP_SERVERS}  # Kafka 브로커 주소 (환경변수)
    client-id: ${spring.application.name}    # Kafka 클라이언트 식별자 (앱 이름)
    properties:
        spring.json.add.type.headers: false  # 메시지에 Java 타입 헤더 제외 — Consumer가 다른 언어일 수 있으므로
        request.timeout.ms: 20000            # 브로커 응답 대기 최대 20초 — 초과 시 TimeoutException
        retry.backoff.ms: 500                # 재시도 간격 0.5초 — 브로커 일시 장애 시 부하 방지
        auto:
          create.topics.enable: false         # 토픽 자동 생성 비활성화 — 운영 환경에서 의도치 않은 토픽 생성 방지
          register.schemas: false             # 스키마 레지스트리 비활성화 — Avro/Protobuf 미사용
          offset.reset: latest                # Consumer 첫 연결 시 최신 메시지부터 소비 — earliest면 전체 재처리
        use.latest.version: true              # 직렬화/역직렬화 최신 버전 사용
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer     # 키: 문자열 직렬화 (파티션 키)
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer  # 값: JSON 직렬화
      acks: all           # 리더 + 모든 팔로워가 저장 확인 후 성공 — 메시지 유실 방지 (성능 < 안정성)
      retries: 2147483647  # 무한 재시도 — idempotence=true가 중복을 막으므로 delivery.timeout.ms(120초) 내에서 최대한 재시도
      properties:
        enable.idempotence: true                  # Producer 멱등성 활성화 — 리트라이 시 동일 메시지 중복 저장 방지
        max.in.flight.requests.per.connection: 5  # 브로커 응답 대기 중 최대 동시 요청 수 — idempotence=true 시 5 이하 필수
        delivery.timeout.ms: 120000               # 발행 최대 대기 시간 120초 — 이 시간 내에서 retries만큼 재시도, 초과 시 실패 처리
        linger.ms: 5                              # 5ms 동안 메시지를 모아서 배치 전송 — 네트워크 효율 향상 (0이면 즉시 전송)
    consumer:
      group-id: loopers-default-consumer  # 기본 Consumer 그룹 — 같은 그룹의 Consumer끼리 파티션 분배
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer      # 키: 문자열 역직렬화
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer   # 값: 바이트 배열로 수신 후 수동 변환
      properties:
        enable-auto-commit: false  # 자동 오프셋 커밋 비활성화 — 처리 완료 후 수동 커밋으로 메시지 유실 방지
    listener:
      ack-mode: manual  # 수동처 ACK — Consumer가 acknowledge() 호출 시에만 오프셋 커밋

---
spring.config.activate.on-profile: local, test

spring:
  kafka:
    bootstrap-servers: localhost:19092
    admin:
      properties:
        bootstrap.servers: kafka:9092

---
spring.config.activate.on-profile: dev

---
spring.config.activate.on-profile: qa

---
spring.config.activate.on-profile: prd
