server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - logging.yml
      - monitoring.yml

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-for-hs256-algorithm}
  expiration: 3600
  issuer: commerce-api

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

payment:
  resilience:
    timeout-duration: 3s
    circuit-breaker-sliding-window-size: 4
    circuit-breaker-minimum-number-of-calls: 2
    circuit-breaker-failure-rate-threshold: 50
    circuit-breaker-wait-duration-in-open-state: 30s
    circuit-breaker-permitted-number-of-calls-in-half-open-state: 2

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false
