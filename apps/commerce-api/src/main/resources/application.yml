server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

spring.cloud:
  openfeign:
    client:
      config:
        pg-simulator:
          connect-timeout: 1000
          read-timeout: 2000

pg:
  base-url: http://localhost:8082
  callback-url: http://localhost:8080/api/v1/payments/callback

queue:
  enabled: false
  batch-size: 30
  scheduler-interval-ms: 200
  token-ttl-seconds: 300
  max-active-tokens: 150
  counter-correction-interval: 50

resilience4j:
  retry:
    instances:
      pgRequestPayment:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - feign.RetryableException
        ignore-exceptions:
          - com.loopers.support.error.CoreException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      pgGetPaymentDetail:
        max-attempts: 2
        wait-duration: 300ms
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - feign.RetryableException
        ignore-exceptions:
          - com.loopers.support.error.CoreException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      dbWrite:
        max-attempts: 2
        wait-duration: 300ms
        retry-exceptions:
          - org.springframework.dao.CannotAcquireLockException
          - org.springframework.dao.PessimisticLockingFailureException
          - org.springframework.dao.DataAccessResourceFailureException
        ignore-exceptions:
          - com.loopers.support.error.CoreException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
  circuitbreaker:
    instances:
      pgPayment:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 70
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 5
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - feign.RetryableException
        ignore-exceptions:
          - com.loopers.support.error.CoreException
      database:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 5
        record-exceptions:
          - org.springframework.dao.CannotAcquireLockException
          - org.springframework.dao.PessimisticLockingFailureException
          - org.springframework.dao.DataAccessResourceFailureException
        ignore-exceptions:
          - com.loopers.support.error.CoreException

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false