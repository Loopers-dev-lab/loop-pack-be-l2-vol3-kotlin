
spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - optional:classpath:jpa.yml
      - optional:classpath:redis.yml
      - optional:classpath:logging.yml
      - optional:classpath:monitoring.yml
      - optional:classpath:payment-client.yml
  cache:
    type: redis
  task:
    scheduling:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
      compression-type: snappy
      properties:
        enable.idempotence: true
        linger.ms: 10
        batch.size: 16384
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: commerce-api-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed

pg:
  base-url: http://localhost:8083
  loop:
    callback-url: http://localhost:8080/api/v1/payments/callback

resilience4j:
  circuitbreaker:
    instances:
      loop-pg-payment:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        # 성능 분석 기반 조정: p99(510ms) + 90ms 버퍼 = 600ms
        # 목표: 500ms 이상 지연을 감지하여 circuit breaker 동작
        slowCallDurationThreshold: 600ms
        slowCallRateThreshold: 50
        recordExceptions:
          - java.lang.Exception
  retry:
    instances:
      loop-pg-payment:
        maxAttempts: 2
        waitDuration: 200ms
        retryExceptions:
          - java.lang.Exception

ranking:
  strategy: daily
  sliding-window:
    window-days: 7
    decay-factor: 0.9

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev
  cache:
    redis:
      time-to-live: 5m  # dev: 5분 (개발 중 빠른 갱신)

pg:
  loop:
    callback-url: https://dev.api.example.com/api/v1/payments/callback

---
spring:
  config:
    activate:
      on-profile: qa
  cache:
    redis:
      time-to-live: 10m  # qa: 10분 (테스트 환경)

pg:
  loop:
    callback-url: https://qa.api.example.com/api/v1/payments/callback

---
spring:
  config:
    activate:
      on-profile: prd
  cache:
    redis:
      time-to-live: 30m  # prd: 30분 (안정적 캐싱)

pg:
  loop:
    callback-url: https://api.example.com/api/v1/payments/callback

springdoc:
  api-docs:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: perf
  cache:
    redis:
      time-to-live: 5m  # perf: 5분