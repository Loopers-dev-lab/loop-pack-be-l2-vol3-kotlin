server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

ranking:
  ttl-days: 2
  weight:
    view: 0.1
    like: 0.2
    order: 0.6

pg:
  simulator:
    url: http://localhost:8081
    callback-url: http://localhost:8080/api/v1/payments/callback

resilience4j:
  circuitbreaker:
    circuitBreakerAspectOrder: 1 # CB가 바깥 — retry 3회 소진 후 최종 결과만 실패 1건으로 카운트
    instances:
      pgPaymentRequest: # 결제 요청용 CB — 결제 실패가 조회를 차단하지 않도록 분리
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 4s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 5
      pgPaymentQuery: # 상태 조회용 CB — 결제 CB Open 시에도 복구/조회 가능
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 4s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 5
  retry:
    retryAspectOrder: 2 # Retry가 안쪽 — PG 호출 실패 시 먼저 재시도
    instances:
      pgPaymentRequest:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - feign.RetryableException
          - java.net.SocketTimeoutException
          - java.net.ConnectException
      pgPaymentQuery:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - feign.RetryableException
          - java.net.SocketTimeoutException
          - java.net.ConnectException

queue:
  enabled: true
  max-queue-size: 50000 # 대기열 최대 인원 — 이 이상이면 429 응답으로 신규 진입 차단
  scheduler:
    interval-ms: 100 # 토큰 발급 주기(ms) — 1초에 10회 분산 발급하여 Thundering Herd 완화
    batch-size: 5 # 1회당 발급 수 — 실측 기반 재조정: pool-size(40)/0.543s×0.7/10≈5. 초기 추정 18에서 하향
  token:
    ttl-seconds: 300 # 입장 토큰 유효 시간(5분) — 결제 재시도 여유 포함
  redis:
    queue-key: "waiting-queue"
    token-key-prefix: "entry-token:"

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false