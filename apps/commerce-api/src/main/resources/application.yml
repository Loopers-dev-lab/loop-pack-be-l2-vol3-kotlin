server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml
  jpa:
    properties:
      hibernate:
        jdbc:
          # IDENTITY 전략에서는 INSERT 배칭 불가. UPDATE/DELETE 배칭에만 적용됨
          batch_size: 1000
        order_inserts: true
cache:
  mode: ${CACHE_MODE:layered}
  caffeine:
    max-size: 5000
    refresh-seconds: 2
    expire-seconds: 10
  stampede:
    strategy: ${STAMPEDE_STRATEGY:none}

pg:
  base-url: ${PG_BASE_URL}
  callback-url: ${PG_CALLBACK_URL}
  connect-timeout: 3000
  read-timeout: 5000

resilience4j:
  circuitbreaker:
    instances:
      pgClient:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test

pg:
  base-url: http://localhost:8082
  callback-url: http://localhost:8080/internal/v1/payments/callback

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false