server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml
  task:
    scheduling:
      pool:
        size: 3
      thread-name-prefix: scheduler-
      shutdown:
        await-termination: true
        await-termination-period: 30s
  cloud:
    openfeign:
      client:
        config:
          pgClient:
            # [CR 미반영] 타임아웃 값(1s/3s)은 시뮬레이터 기반 초기값.
            # 실 PG 연동 시 p95/p99 응답 분포를 측정하여 조정 필요.
            connect-timeout: 1000
            read-timeout: 3000
            logger-level: none

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

# PG Simulator 설정
pg:
  base-url: ${PG_BASE_URL:http://localhost:8082}
  callback-url: ${PG_CALLBACK_URL:http://localhost:8080/api/v1/payments/callback}

# 대기열 설정
queue:
  max-capacity: ${QUEUE_MAX_CAPACITY:50000}
  batch-size: ${QUEUE_BATCH_SIZE:18}
  token-ttl-seconds: ${QUEUE_TOKEN_TTL:300}
  scheduler-delay-ms: ${QUEUE_SCHEDULER_DELAY_MS:100}

# Resilience4j 설정
# aspect order: CircuitBreaker(1)가 Retry(2) 바깥에서 먼저 평가 → 서킷 오픈 시 즉시 fallback
resilience4j:
  circuitbreaker:
    circuitBreakerAspectOrder: 1 # CB가 Retry 바깥에서 먼저 평가 → 서킷 오픈 시 즉시 fallback
    instances:
      pg-payment-request:
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      pg-status-query:
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    retryAspectOrder: 2
    instances:
      # 현재 시뮬레이터가 orderId 기반 멱등 처리를 하므로 IOException 재시도가 안전함.
      # 실 PG 연동 시 결제 요청/상태 조회 retry 프로필을 분리하고,
      # 결제 요청은 멱등키 보장 예외에만 제한적으로 재시도해야 함.
      pg-retry:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - feign.RetryableException
          - java.net.SocketTimeoutException
          - java.io.IOException
        fail-after-max-attempts: true

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false