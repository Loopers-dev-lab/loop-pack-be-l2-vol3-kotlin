server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - logging.yml
      - monitoring.yml
  cache:
    type: redis
    redis:
      time-to-live: 30m  # 상품 정보 캐시 TTL: 30분
      use-key-prefix: false  # 각 @Cacheable의 value가 prefix 역할

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev
  cache:
    redis:
      time-to-live: 5m  # dev: 5분 (개발 중 빠른 갱신)

---
spring:
  config:
    activate:
      on-profile: qa
  cache:
    redis:
      time-to-live: 10m  # qa: 10분 (테스트 환경)

---
spring:
  config:
    activate:
      on-profile: prd
  cache:
    redis:
      time-to-live: 30m  # prd: 30분 (안정적 캐싱)

springdoc:
  api-docs:
    enabled: false