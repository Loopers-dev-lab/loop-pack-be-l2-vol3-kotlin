server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml
      - pg.yml
      - resilience4j.yml

queue:
  max-queue-size: 50000        # 대기열 최대 인원 — Redis 메모리 보호용 상한선
  token-ttl-seconds: 300       # 입장 토큰 유효 시간 (5분), 미사용 시 자동 만료
  batch-size: 18               # 스케줄러 1회 토큰 발급 수 — Thundering Herd 방지를 위해 분산 발급
  max-active-tokens: 175       # 동시 활성 토큰 수 상한 — DB 커넥션 풀(40) × (1000ms/200ms) × 87.5%
  throughput-per-second: 175.0 # 초당 처리량 — 예상 대기 시간 계산에 사용
  scheduler:
    enabled: true              # false 시 스케줄러 비활성화 (어드민 API로 제어 권장)

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test


---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false