server:
  shutdown: graceful
  tomcat:
    threads:
      max: 50 # Virtual Threads 환경에서 carrier thread 적정화 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 10000 # 최대 동시 연결 수 (default : 8192)
    accept-count: 200 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  threads:
    virtual:
      enabled: true # JDK 21 Virtual Threads 활성화
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - logging.yml
      - monitoring.yml

pg:
  base-url: http://localhost:8082
  connect-timeout: 2000
  read-timeout: 3000
  callback-url: http://localhost:8080/api/v1/payments/callback

resilience4j:
  circuitbreaker:
    instances:
      pgPayment:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 60
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 5
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 80

queue:
  batch-size: 300
  scheduler-interval-seconds: 3
  token-ttl-seconds: 300

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

server:
  tomcat:
    threads:
      max: 50 # Virtual Threads 환경에서 carrier thread 적정화
    max-connections: 10000
    accept-count: 200

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false