server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

# PG 시뮬레이터 설정
pg:
  base-url: ${PG_BASE_URL:http://localhost:8082}
  callback-url: ${PG_CALLBACK_URL:http://localhost:8080/api/v1/payments/callback}
  callback-secret-key: ${PG_CALLBACK_SECRET_KEY:pg-callback-hmac-secret-for-local}

# FeignClient + CircuitBreaker 통합
spring.cloud.openfeign:
  circuitbreaker:
    enabled: true # FeignClient에 CircuitBreaker 통합 활성화
    group:
      enabled: true # 같은 FeignClient의 모든 메서드가 하나의 CircuitBreaker 인스턴스를 공유
  client:
    config:
      pg-simulator:
        connect-timeout: 1000  # 연결 타임아웃 1초
        read-timeout: 2000     # 읽기 타임아웃 2초 (PG 응답 최대 500ms + 여유)

# Resilience4j 설정
# aspect-order: 낮은 값이 외부(먼저 실행). CB가 Retry를 감싸도록 설정
resilience4j:
  circuitbreaker:
    circuitBreakerAspectOrder: 1
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10            # 최근 10건 기준
        failure-rate-threshold: 50         # 실패율 50% 이상 → OPEN
        wait-duration-in-open-state: 10s   # OPEN 상태 유지 시간
        permitted-number-of-calls-in-half-open-state: 3  # HALF_OPEN에서 허용 호출 수
        register-health-indicator: true
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      pg-simulator:
        base-config: default
      order-queue:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    retryAspectOrder: 2
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2
        enable-exponential-backoff: true
        retry-exceptions:
          - java.io.IOException
          - feign.RetryableException
    instances:
      pg-query:
        base-config: default
      order-queue:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.data.redis.RedisConnectionFailureException
  bulkhead:
    instances:
      pg-simulator:
        max-concurrent-calls: 25   # PG 동시 요청 최대 25개 (Tomcat 200 스레드 중 일부만 허용)
        max-wait-duration: 0       # 대기 없이 즉시 실패

# 주문 대기열 설정
queue:
  admission:
    batch-size: 9
    fixed-rate: 50
    jitter-range: 20

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false