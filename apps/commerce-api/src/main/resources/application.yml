
spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - logging.yml
      - monitoring.yml
  cache:
    type: redis

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev
  cache:
    redis:
      time-to-live: 5m  # dev: 5분 (개발 중 빠른 갱신)

---
spring:
  config:
    activate:
      on-profile: qa
  cache:
    redis:
      time-to-live: 10m  # qa: 10분 (테스트 환경)

---
spring:
  config:
    activate:
      on-profile: prd
  cache:
    redis:
      time-to-live: 30m  # prd: 30분 (안정적 캐싱)

springdoc:
  api-docs:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: perf
  cache:
    redis:
      time-to-live: 5m  # perf: 5분