spring:
  datasource:
    url: jdbc:mysql://localhost:3306/loopers?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 100
          fetch_size: 100
        order_inserts: true
        order_updates: true
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
      compression-type: snappy
      properties:
        enable.idempotence: true
        linger.ms: 10
        batch.size: 16384
    consumer:
      group-id: commerce-api-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed

pg:
  base-url: http://localhost:8083

resilience4j:
  circuitbreaker:
    instances:
      loop-pg-payment:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 5s
        recordExceptions:
          - java.lang.Exception
  retry:
    instances:
      loop-pg-payment:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - java.lang.Exception

logging:
  level:
    root: INFO
    com.loopers: DEBUG
