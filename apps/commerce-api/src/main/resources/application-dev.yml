spring:
  datasource:
    url: jdbc:mysql://localhost:3306/loopers?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 100
          fetch_size: 100
        order_inserts: true
        order_updates: true
  sql:
    init:
      mode: always

logging:
  level:
    root: INFO
    com.loopers: DEBUG
