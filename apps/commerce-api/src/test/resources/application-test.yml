spring:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 500
          fetch_size: 500
        order_inserts: true
        order_updates: true
  sql:
    init:
      mode: never
      continue-on-error: false
  cache:
    type: simple  # Unit test 기본값

pg:
  loop:
    callback-url: http://localhost:8080/api/v1/payments/callback

datasource:
  mysql-jpa:
    main:
      jdbc-url: jdbc:mysql://localhost:3306/loopers
      username: application
      password: application

logging:
  level:
    # JPA SQL 로깅 (대량 데이터 로딩 중 로그 확인)
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.batch: WARN
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.cache: DEBUG
