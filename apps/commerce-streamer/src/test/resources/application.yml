spring:
  profiles:
    active: test
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml
  kafka:
    listener:
      auto-startup: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

demo-kafka:
  test:
    topic-name: demo.internal.topic-v1
